# data/phenoObs/ingest/transform.yaml
null_values: ["", "na", "n/a", "null", "none", "-", "u", "m"]

coercions:
  integer:
    default: null
    drop_invalid: true
  float:
    default: null
    drop_invalid: true
  date:
    input_formats: ["%Y-%m-%d"]
    output_format: "%Y-%m-%d"
    default: null
    drop_invalid: true

fields:
  year:
    datatype: integer
  dayOfYear:
    datatype: integer
  date:
    datatype: date
